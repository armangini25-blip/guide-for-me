<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Build 2026-08-29 (Auditoria 8, achado baixo de @security-auditor): consistência com
     pista.html/index.html, que já têm essa política — página estática sem JS/recurso externo, o
     risco prático era mínimo, mas não custa nada fechar por completo. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>Sessão encerrada</title>
<style>
  :root{ --bg:#faf7f2; --text:#20242b; --text-muted:#5b6270; --accent:#c9822a; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#171512; --text:#efe9de; --text-muted:#b3aa9c; --accent:#e2a24f; }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    display:flex; align-items:center; justify-content:center; padding:24px;
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  }
  main{ text-align:center; max-width:340px; }
  .icon{ font-size:2.2rem; margin-bottom:14px; }
  h1{ font-size:1.15rem; margin:0 0 8px; }
  p{ color:var(--text-muted); font-size:.92rem; line-height:1.5; margin:0; }
</style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">👋</div>
    <h1>Sessão encerrada</h1>
    <p>Obrigado por visitar. Você já pode fechar esta aba — não é preciso fazer mais nada aqui.</p>
  </main>
</body>
</html>
